# .github/workflows/container-security.yml
name: Container Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly scan on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # JOB 1: Build and Scan
  # ==========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    
    outputs:
      scan-passed: ${{ steps.fcs-scan.outputs.exit-code == '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: CrowdStrike FCS Security Scan
        id: fcs-scan
        uses: crowdstrike/fcs-action@v3.0.0
        with:
          falcon_client_id: ${{ vars.FALCON_CLIENT_ID }}
          falcon_region: 'us-2'
          scan_type: image
          image: ${{ env.IMAGE_NAME }}:scan
          fail_on: 'critical=1'
          minimum_severity: critical
          vuln_fixable_only: false
          show_full_description: true
          report_formats: sarif
          output_path: './crowdstrike-results.sarif'
          upload_results: true
          timeout: 600
        env:
          FALCON_CLIENT_SECRET: ${{ secrets.FALCON_CLIENT_SECRET }}

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ./crowdstrike-results.sarif

      - name: Security Gate Decision
        if: always()
        run: |
          if [ "${{ steps.fcs-scan.outputs.exit-code }}" != "0" ]; then
            echo "::error::❌ Security scan failed - Critical vulnerabilities found!"
            echo "Review the Security tab for detailed findings."
            exit 1
          fi
          echo "✅ Security scan passed!"

  # ==========================================
  # JOB 2: Push to Registry (only if scan passes)
  # ==========================================
  push-image:
    name: Push Image
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deployment approved
        run: |
          echo "🎉 Image pushed successfully!"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
