# .github/workflows/security-scan.yml
name: Build, Scan, and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================
      # TESTING: Pull a known vulnerable image
      # ============================================
      - name: Pull vulnerable image for testing
        run: |
          echo "🧪 TESTING MODE: Using vulnerable nginx:1.16 image"
          docker pull nginx:1.16

      # ============================================
      # CrowdStrike Scan - Should FAIL on this image
      # ============================================
      - name: CrowdStrike FCS Security Scan
        id: fcs-scan
        uses: crowdstrike/fcs-action@v3.0.0
        with:
          falcon_client_id: ${{ vars.FALCON_CLIENT_ID }}
          falcon_region: 'us-2'
          scan_type: image
          image: nginx:1.16
          fail_on: 'critical=1'
          minimum_severity: critical
          show_full_description: true
          report_formats: sarif
          output_path: './crowdstrike-results.sarif'
        env:
          FALCON_CLIENT_SECRET: ${{ secrets.FALCON_CLIENT_SECRET }}

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('./crowdstrike-results.sarif') != ''
        with:
          sarif_file: ./crowdstrike-results.sarif

      - name: Security Gate Decision
        if: always()
        run: |
          echo "============================================"
          echo "🔍 SCAN RESULTS"
          echo "============================================"
          echo "Exit Code: ${{ steps.fcs-scan.outputs.exit-code }}"
          if [ "${{ steps.fcs-scan.outputs.exit-code }}" != "0" ]; then
            echo "❌ PIPELINE BLOCKED!"
            echo "Critical vulnerabilities found in image."
            exit 1
          fi
          echo "✅ Security scan passed!"

  deploy:
    name: Deploy Application
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy notification
        run: |
          echo "🚀 This should NOT run if vulnerabilities were found!"
